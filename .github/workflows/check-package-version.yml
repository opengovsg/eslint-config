name: Lint, test and check package version

on:
  - pull_request

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run lint
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm test
      # The presets disable ESLint's formatting rules, so `lint` above cannot
      # catch formatting. This step is the only thing enforcing it.
      - run: npm run format:check
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump the version in package.json if this step fails. A new version is needed to publish this package on merge.
        run: |
          git fetch origin main
          git diff origin/main..HEAD -- package.json | grep "+  \"version\": \""
          git diff origin/main..HEAD -- package-lock.json | grep "+  \"version\": \""
